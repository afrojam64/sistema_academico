spring.application.name=sistema-academico

# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN - SISTEMA ACADÉMICO
# Spring Boot 3.5.8 | Java 17 | PostgreSQL
# ===================================================================

# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR TOMCAT
# ===================================================================
# Puerto en el que correrá la aplicación (http://localhost:8080)
#server.port=8081

# Contexto de la aplicación (ruta base de la URL)
server.servlet.context-path=

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS POSTGRESQL
# ===================================================================
# URL de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_academico

# Usuario de PostgreSQL (por defecto es 'postgres')
spring.datasource.username=postgres

# ?? CAMBIAR: Contraseña de PostgreSQL (pon tu contraseña aquí)
spring.datasource.password=TmX85col1978

# Driver JDBC de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===================================================================
# CONFIGURACIÓN DE JPA/HIBERNATE (ORM)
# ===================================================================
# Estrategia de generación de tablas
# - create: Borra y recrea todas las tablas cada vez (USAR AHORA)
# - update: Actualiza estructura sin borrar datos (usar después)
# - validate: Solo valida que coincidan
# - none: No hace nada automáticamente
spring.jpa.hibernate.ddl-auto=update

# Dialecto de PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostrar consultas SQL en consola (útil para aprender)
spring.jpa.show-sql=true

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Mostrar valores de parámetros en consultas
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Estrategia de nombres (convierte camelCase a snake_case)
# ImplicitNamingStrategy: nombres por defecto
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
# PhysicalNamingStrategy: transformación final de nombres
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ===================================================================
# CONFIGURACIÓN DE THYMELEAF
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# CONFIGURACIÓN DE RECURSOS ESTÁTICOS
# ===================================================================
spring.web.resources.static-locations=classpath:/static/

# ===================================================================
# CONFIGURACIÓN DE LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.sistema.academico=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# CONFIGURACIÓN DE VALIDACIÓN
# ===================================================================
spring.validation.enabled=true

# ===================================================================
# CONFIGURACIÓN DE MANEJO DE ERRORES
# ===================================================================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-binding-errors=always

# ===================================================================
# CONFIGURACIÓN DE SPRING SECURITY (TEMPORAL)
# ===================================================================
# Usuario y contraseña por defecto (cambiaremos esto después)
spring.security.user.name=admin
spring.security.user.password=admin123

# ===================================================================
# CONFIGURACIÓN DE CODIFICACIÓN
# ===================================================================
spring.mandatory-file-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# CONFIGURACIÓN DE MENSAJES
# ===================================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8