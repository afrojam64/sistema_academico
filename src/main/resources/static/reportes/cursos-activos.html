<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos Activos - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        .user-info { color: white; }

        .reporte-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 30px auto;
            max-width: 1600px;
        }

        .header-reporte {
            text-align: center;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2rem;
            margin: 0;
        }

        .stat-card p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }

        .filtros-section {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px solid #3b82f6;
        }

        .curso-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .curso-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-color: #3b82f6;
        }

        .curso-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
        }

        .badge-ocupacion {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .badge-completo {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-alto {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-medio {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-bajo {
            background: #f3f4f6;
            color: #4b5563;
        }

        .progreso-bar {
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        .progreso-fill {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: width 0.3s;
        }

        .progreso-completo {
            background: linear-gradient(90deg, #dc2626, #ef4444);
        }

        .progreso-alto {
            background: linear-gradient(90deg, #f59e0b, #fb923c);
        }

        .progreso-medio {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
        }

        .progreso-bajo {
            background: linear-gradient(90deg, #6b7280, #9ca3af);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .info-item {
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .info-item strong {
            color: #1e40af;
        }

        .tabla-cursos {
            width: 100%;
            margin-top: 20px;
        }

        .tabla-cursos th {
            background: #f9fafb;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tabla-cursos td {
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }

        .tabla-cursos tr:hover {
            background: #f9fafb;
        }

        .filtro-activo {
            background: #3b82f6 !important;
            color: white !important;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            .reporte-container {
                box-shadow: none;
                margin: 0;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark no-print">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-chalkboard"></i> Cursos Activos
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Usuario</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="reporte-container">

        <!-- Header -->
        <div class="header-reporte">
            <h1><i class="fas fa-chalkboard-teacher"></i> Reporte de Cursos Activos</h1>
            <p class="text-muted mb-0">Información completa de todos los cursos en el periodo actual</p>
        </div>

        <!-- Estadísticas Generales -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalCursos">0</h3>
                <p>Total Cursos Activos</p>
            </div>
            <div class="stat-card">
                <h3 id="promedioOcupacion">0%</h3>
                <p>Promedio Ocupación</p>
            </div>
            <div class="stat-card">
                <h3 id="totalEstudiantes">0</h3>
                <p>Estudiantes Inscritos</p>
            </div>
            <div class="stat-card">
                <h3 id="cursosCompletos">0</h3>
                <p>Cursos Completos</p>
            </div>
            <div class="stat-card">
                <h3 id="cuposDisponibles">0</h3>
                <p>Cupos Disponibles</p>
            </div>
            <div class="stat-card">
                <h3 id="cursosBajaOcupacion">0</h3>
                <p>Baja Ocupación (<50%)</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filtros-section no-print">
            <h5 class="mb-3"><i class="fas fa-filter"></i> Filtrar Cursos</h5>
            <div class="row">
                <div class="col-md-3 mb-2">
                    <button class="btn btn-outline-primary w-100 filtro-btn filtro-activo"
                            data-filtro="TODOS" onclick="filtrarCursos('TODOS', this)">
                        <i class="fas fa-list"></i> Todos
                    </button>
                </div>
                <div class="col-md-3 mb-2">
                    <button class="btn btn-outline-danger w-100 filtro-btn"
                            data-filtro="COMPLETO" onclick="filtrarCursos('COMPLETO', this)">
                        <i class="fas fa-exclamation-circle"></i> Completos
                    </button>
                </div>
                <div class="col-md-3 mb-2">
                    <button class="btn btn-outline-warning w-100 filtro-btn"
                            data-filtro="ALTO" onclick="filtrarCursos('ALTO', this)">
                        <i class="fas fa-arrow-up"></i> Alta Ocupación (>80%)
                    </button>
                </div>
                <div class="col-md-3 mb-2">
                    <button class="btn btn-outline-secondary w-100 filtro-btn"
                            data-filtro="BAJO" onclick="filtrarCursos('BAJO', this)">
                        <i class="fas fa-arrow-down"></i> Baja Ocupación (<50%)
                    </button>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="buscarCurso"
                           placeholder="🔍 Buscar por nombre, código o profesor..."
                           onkeyup="buscarEnCursos()">
                </div>
            </div>
        </div>

        <!-- Lista de Cursos -->
        <div id="listaCursos">
            <!-- Se llenará dinámicamente -->
        </div>

        <!-- Botones de Acción -->
        <div class="text-center mt-4 no-print">
            <button class="btn btn-primary btn-lg me-2" onclick="window.print()">
                <i class="fas fa-print"></i> Imprimir / Guardar PDF
            </button>
            <button class="btn btn-success btn-lg" onclick="exportarExcel()">
                <i class="fas fa-file-excel"></i> Exportar a Excel
            </button>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');

    if (!token) window.location.href = '/login';
    document.getElementById('userName').textContent = userName || 'Usuario';

    let cursosData = [];
    let filtroActual = 'TODOS';

    // Cargar reporte al iniciar
    cargarReporte();

    async function cargarReporte() {
        Swal.fire({
            title: 'Cargando cursos...',
            text: 'Por favor espera',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        try {
            const response = await axios.get(
                'http://localhost:8080/api/cursos/reporte/activos',
                { headers: { 'Authorization': `Bearer ${token}` } }
            );

            Swal.close();
            cursosData = response.data.cursos;
            mostrarResultados(response.data);

        } catch (error) {
            console.error('Error:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudo cargar el reporte',
                confirmButtonColor: '#3b82f6'
            });
        }
    }

    function mostrarResultados(reporte) {
        // Llenar estadísticas
        document.getElementById('totalCursos').textContent = reporte.totalCursosActivos;
        document.getElementById('promedioOcupacion').textContent = reporte.promedioOcupacion.toFixed(1) + '%';
        document.getElementById('totalEstudiantes').textContent = reporte.totalEstudiantesInscritos;
        document.getElementById('cursosCompletos').textContent = reporte.cursosConCupoCompleto;
        document.getElementById('cuposDisponibles').textContent = reporte.totalCuposDisponibles;
        document.getElementById('cursosBajaOcupacion').textContent = reporte.cursosBajaOcupacion;

        // Mostrar cursos
        mostrarCursos(cursosData);
    }

    function mostrarCursos(cursos) {
        const contenedor = document.getElementById('listaCursos');

        if (cursos.length === 0) {
            contenedor.innerHTML = `
                <div class="alert alert-info text-center p-5">
                    <i class="fas fa-info-circle fa-3x mb-3"></i>
                    <h4>No hay cursos que coincidan con los filtros seleccionados</h4>
                </div>
            `;
            return;
        }

        let html = '';
        cursos.forEach(curso => {
            const badgeClass = curso.estadoOcupacion === 'COMPLETO' ? 'badge-completo' :
                curso.estadoOcupacion === 'ALTO' ? 'badge-alto' :
                    curso.estadoOcupacion === 'MEDIO' ? 'badge-medio' : 'badge-bajo';

            const progresoClass = curso.estadoOcupacion === 'COMPLETO' ? 'progreso-completo' :
                curso.estadoOcupacion === 'ALTO' ? 'progreso-alto' :
                    curso.estadoOcupacion === 'MEDIO' ? 'progreso-medio' : 'progreso-bajo';

            html += `
                <div class="curso-card" data-estado="${curso.estadoOcupacion}"
                     data-searchable="${curso.nombreCurso} ${curso.codigoCurso} ${curso.nombreMateria} ${curso.nombreProfesor}">
                    <div class="curso-header">
                        <div>
                            <h5 class="mb-1">
                                <i class="fas fa-book"></i> ${curso.nombreMateria}
                            </h5>
                            <p class="text-muted mb-0">
                                <strong>Curso:</strong> ${curso.nombreCurso} (${curso.codigoCurso}) |
                                <strong>Periodo:</strong> ${curso.periodo}
                            </p>
                        </div>
                        <span class="badge-ocupacion ${badgeClass}">
                            ${curso.estadoOcupacion}
                        </span>
                    </div>

                    <div class="info-grid mb-3">
                        <div class="info-item">
                            <i class="fas fa-chalkboard-teacher text-primary"></i>
                            <strong>Profesor:</strong><br>
                            ${curso.nombreProfesor}
                        </div>
                        <div class="info-item">
                            <i class="fas fa-building text-primary"></i>
                            <strong>Departamento:</strong><br>
                            ${curso.nombreDepartamento}
                        </div>
                        <div class="info-item">
                            <i class="fas fa-star text-primary"></i>
                            <strong>Créditos:</strong><br>
                            ${curso.creditos}
                        </div>
                        <div class="info-item">
                            <i class="fas fa-calendar text-primary"></i>
                            <strong>Fechas:</strong><br>
                            ${curso.fechaInicio} - ${curso.fechaFin}
                        </div>
                    </div>

                    <div class="progreso-bar">
                        <div class="progreso-fill ${progresoClass}"
                             style="width: ${curso.porcentajeOcupacion}%">
                            ${curso.cupoActual} / ${curso.cupoMaximo} (${curso.porcentajeOcupacion.toFixed(1)}%)
                        </div>
                    </div>

                    <div class="row text-center mt-2">
                        <div class="col-4">
                            <strong>${curso.cupoActual}</strong>
                            <br><small class="text-muted">Inscritos</small>
                        </div>
                        <div class="col-4">
                            <strong>${curso.cuposDisponibles}</strong>
                            <br><small class="text-muted">Disponibles</small>
                        </div>
                        <div class="col-4">
                            <strong>${curso.cupoMaximo}</strong>
                            <br><small class="text-muted">Máximo</small>
                        </div>
                    </div>
                </div>
            `;
        });

        contenedor.innerHTML = html;
    }

    function filtrarCursos(filtro, boton) {
        // Actualizar botón activo
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.classList.remove('filtro-activo');
        });
        boton.classList.add('filtro-activo');

        filtroActual = filtro;
        aplicarFiltros();
    }

    function buscarEnCursos() {
        aplicarFiltros();
    }

    function aplicarFiltros() {
        const textoBusqueda = document.getElementById('buscarCurso').value.toLowerCase();

        let cursosFiltrados = cursosData;

        // Filtrar por estado
        if (filtroActual !== 'TODOS') {
            cursosFiltrados = cursosFiltrados.filter(c => c.estadoOcupacion === filtroActual);
        }

        // Filtrar por texto de búsqueda
        if (textoBusqueda) {
            cursosFiltrados = cursosFiltrados.filter(c => {
                const searchText = `${c.nombreCurso} ${c.codigoCurso} ${c.nombreMateria} ${c.nombreProfesor}`.toLowerCase();
                return searchText.includes(textoBusqueda);
            });
        }

        mostrarCursos(cursosFiltrados);
    }

    function exportarExcel() {
        Swal.fire({
            icon: 'info',
            title: 'Exportar a Excel',
            text: 'Función en desarrollo',
            confirmButtonColor: '#3b82f6'
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
