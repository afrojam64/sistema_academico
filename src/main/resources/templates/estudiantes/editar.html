<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Estudiante - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #10b981, #34d399);
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        .user-info { color: white; }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .form-header {
            border-bottom: 3px solid #10b981;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #34d399);
            border: none;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #059669, #10b981);
        }
        .char-counter {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando datos del estudiante...</p>
    </div>
</div>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="volverLista()">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-edit"></i> Editar Estudiante
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h2><i class="fas fa-user-graduate"></i> Editar Información del Estudiante</h2>
            <p class="text-muted mb-0">Modifica los campos necesarios</p>
        </div>

        <form id="formEditarEstudiante">
            <input type="hidden" id="estudianteId">

            <!-- NOMBRE -->
            <div class="mb-4">
                <label for="nombre" class="form-label fw-bold">
                    Nombre <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="nombre" maxlength="100" required>
                <div class="char-counter">
                    <span id="nombreCounter">0/100</span> caracteres
                </div>
            </div>

            <!-- APELLIDO -->
            <div class="mb-4">
                <label for="apellido" class="form-label fw-bold">
                    Apellido <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="apellido" maxlength="100" required>
                <div class="char-counter">
                    <span id="apellidoCounter">0/100</span> caracteres
                </div>
            </div>

            <!-- CÉDULA -->
            <div class="mb-4">
                <label for="cedula" class="form-label fw-bold">
                    Cédula <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="cedula" maxlength="20" required>
                <div class="char-counter">
                    <span id="cedulaCounter">0/20</span> caracteres
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-4">
                <label for="email" class="form-label fw-bold">
                    Email <span class="text-danger">*</span>
                </label>
                <input type="email" class="form-control" id="email" maxlength="150" required>
            </div>

            <!-- TELÉFONO -->
            <div class="mb-4">
                <label for="telefono" class="form-label fw-bold">
                    Teléfono <span class="text-muted">(Opcional)</span>
                </label>
                <input type="text" class="form-control" id="telefono" maxlength="20">
                <div class="char-counter">
                    <span id="telefonoCounter">0/20</span> caracteres
                </div>
            </div>

            <!-- CÓDIGO ESTUDIANTE -->
            <div class="mb-4">
                <label for="codigoEstudiante" class="form-label fw-bold">
                    Código de Estudiante <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="codigoEstudiante" maxlength="20" required>
                <div class="char-counter">
                    <span id="codigoEstudianteCounter">0/20</span> caracteres
                </div>
            </div>

            <!-- CARRERA -->
            <div class="mb-4">
                <label for="carrera" class="form-label fw-bold">
                    Carrera <span class="text-muted">(Opcional)</span>
                </label>
                <input type="text" class="form-control" id="carrera" maxlength="100">
                <div class="char-counter">
                    <span id="carreraCounter">0/100</span> caracteres
                </div>
            </div>

            <!-- SEMESTRE -->
            <div class="mb-4">
                <label for="semestre" class="form-label fw-bold">
                    Semestre <span class="text-muted">(Opcional)</span>
                </label>
                <input type="number" class="form-control" id="semestre" min="1" max="12">
            </div>

            <!-- FECHA DE INGRESO -->
            <div class="mb-4">
                <label for="fechaIngreso" class="form-label fw-bold">
                    Fecha de Ingreso
                </label>
                <input type="date" class="form-control" id="fechaIngreso">
            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2 justify-content-end mt-4">
                <button type="button" class="btn btn-secondary" onclick="cancelar()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    const userRole = localStorage.getItem('userRole');

    if (!token) window.location.href = '/login';

    document.getElementById('userName').textContent = userName || 'Admin';

    const urlParams = new URLSearchParams(window.location.search);
    const estudianteId = urlParams.get('id') || window.location.pathname.split('/').pop();

    let formModificado = false;
    let guardandoFormulario = false;

    async function cargarDatos() {
        try {
            const estudianteResponse = await axios.get(`http://localhost:8080/api/estudiantes/${estudianteId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const estudiante = estudianteResponse.data;

            document.getElementById('estudianteId').value = estudiante.id;
            document.getElementById('nombre').value = estudiante.nombre;
            document.getElementById('apellido').value = estudiante.apellido;
            document.getElementById('cedula').value = estudiante.cedula;
            document.getElementById('email').value = estudiante.email;
            document.getElementById('telefono').value = estudiante.telefono || '';
            document.getElementById('codigoEstudiante').value = estudiante.codigoEstudiante;
            document.getElementById('carrera').value = estudiante.carrera || '';
            document.getElementById('semestre').value = estudiante.semestre || '';
            document.getElementById('fechaIngreso').value = estudiante.fechaIngreso ?
                formatearFechaParaInput(estudiante.fechaIngreso) : '';

            document.getElementById('nombreCounter').textContent = `${estudiante.nombre.length}/100`;
            document.getElementById('apellidoCounter').textContent = `${estudiante.apellido.length}/100`;
            document.getElementById('cedulaCounter').textContent = `${estudiante.cedula.length}/20`;
            document.getElementById('telefonoCounter').textContent = `${(estudiante.telefono || '').length}/20`;
            document.getElementById('codigoEstudianteCounter').textContent = `${estudiante.codigoEstudiante.length}/20`;
            document.getElementById('carreraCounter').textContent = `${(estudiante.carrera || '').length}/100`;

            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            console.error('Error cargando datos:', error);
            document.getElementById('loadingOverlay').style.display = 'none';

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudieron cargar los datos del estudiante',
                confirmButtonColor: '#10b981'
            }).then(() => {
                window.location.href = '/estudiantes';
            });
        }
    }

    function formatearFechaParaInput(fechaStr) {
        const partes = fechaStr.split('/');
        if (partes.length === 3) {
            return `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
        return fechaStr;
    }

    cargarDatos();

    document.getElementById('nombre').addEventListener('input', function(e) {
        document.getElementById('nombreCounter').textContent = `${e.target.value.length}/100`;
        formModificado = true;
    });

    document.getElementById('apellido').addEventListener('input', function(e) {
        document.getElementById('apellidoCounter').textContent = `${e.target.value.length}/100`;
        formModificado = true;
    });

    document.getElementById('cedula').addEventListener('input', function(e) {
        document.getElementById('cedulaCounter').textContent = `${e.target.value.length}/20`;
        formModificado = true;
    });

    document.getElementById('telefono').addEventListener('input', function(e) {
        document.getElementById('telefonoCounter').textContent = `${e.target.value.length}/20`;
        formModificado = true;
    });

    document.getElementById('codigoEstudiante').addEventListener('input', function(e) {
        document.getElementById('codigoEstudianteCounter').textContent = `${e.target.value.length}/20`;
        formModificado = true;
    });

    document.getElementById('carrera').addEventListener('input', function(e) {
        document.getElementById('carreraCounter').textContent = `${e.target.value.length}/100`;
        formModificado = true;
    });

    ['email', 'semestre', 'fechaIngreso'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => formModificado = true);
    });

    document.getElementById('formEditarEstudiante').addEventListener('submit', async function(e) {
        e.preventDefault();

        const datos = {
            nombre: document.getElementById('nombre').value.trim(),
            apellido: document.getElementById('apellido').value.trim(),
            cedula: document.getElementById('cedula').value.trim(),
            email: document.getElementById('email').value.trim(),
            telefono: document.getElementById('telefono').value.trim() || null,
            codigoEstudiante: document.getElementById('codigoEstudiante').value.trim(),
            carrera: document.getElementById('carrera').value.trim() || null,
            semestre: document.getElementById('semestre').value ? parseInt(document.getElementById('semestre').value) : null,
            fechaIngreso: document.getElementById('fechaIngreso').value || null
        };

        if (!datos.nombre || !datos.apellido || !datos.cedula || !datos.email || !datos.codigoEstudiante) {
            Swal.fire({
                icon: 'warning',
                title: 'Campos incompletos',
                text: 'Por favor completa todos los campos obligatorios',
                confirmButtonColor: '#10b981'
            });
            return;
        }

        const result = await Swal.fire({
            title: '¿Guardar cambios?',
            text: 'Se actualizará la información del estudiante',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, guardar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#10b981'
        });

        if (result.isConfirmed) {
            document.getElementById('loadingOverlay').querySelector('p').textContent = 'Guardando cambios...';
            document.getElementById('loadingOverlay').style.display = 'flex';
            guardandoFormulario = true;

            try {
                await axios.put(
                    `http://localhost:8080/api/estudiantes/${estudianteId}`,
                    datos,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                document.getElementById('loadingOverlay').style.display = 'none';

                Swal.fire({
                    icon: 'success',
                    title: '¡Cambios guardados!',
                    text: 'La información del estudiante fue actualizada correctamente',
                    confirmButtonColor: '#10b981'
                }).then(() => {
                    window.location.href = '/estudiantes';
                });

            } catch (error) {
                document.getElementById('loadingOverlay').style.display = 'none';
                guardandoFormulario = false;

                let mensajeError = 'No se pudieron guardar los cambios';

                if (error.response?.data?.message?.includes('email')) {
                    mensajeError = 'Ya existe un estudiante con ese email';
                } else if (error.response?.data?.message?.includes('cedula') ||
                    error.response?.data?.message?.includes('cédula')) {
                    mensajeError = 'Ya existe un estudiante con esa cédula';
                } else if (error.response?.data?.message?.includes('código')) {
                    mensajeError = 'Ya existe un estudiante con ese código';
                } else if (error.response?.data?.message) {
                    mensajeError = error.response.data.message;
                }

                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensajeError,
                    confirmButtonColor: '#10b981'
                });
            }
        }
    });

    function cancelar() {
        if (formModificado) {
            Swal.fire({
                title: '¿Descartar cambios?',
                text: 'Se perderán las modificaciones realizadas',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, descartar',
                cancelButtonText: 'Continuar editando',
                confirmButtonColor: '#dc2626'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/estudiantes';
                }
            });
        } else {
            window.location.href = '/estudiantes';
        }
    }

    function volverLista() {
        cancelar();
    }

    window.addEventListener('beforeunload', function(e) {
        if (formModificado && !guardandoFormulario) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
