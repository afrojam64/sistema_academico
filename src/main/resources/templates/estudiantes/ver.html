<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Estudiante - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #10b981, #34d399);
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        .user-info { color: white; }
        .detail-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .detail-header {
            border-bottom: 3px solid #10b981;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .detail-row {
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .detail-label {
            font-weight: 600;
            color: #374151;
        }
        .detail-value {
            color: #1f2937;
        }
        .badge-codigo {
            background: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .badge-estado-activo {
            background: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .badge-estado-inactivo {
            background: #ef4444;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #34d399);
            border: none;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #059669, #10b981);
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando información del estudiante...</p>
    </div>
</div>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="window.location.href='/estudiantes'">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-eye"></i> Detalles del Estudiante
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="detail-container">
        <div class="detail-header">
            <h2><i class="fas fa-user-graduate"></i> Información del Estudiante</h2>
            <p class="text-muted mb-0">Detalles completos del perfil</p>
        </div>

        <div id="estudianteDetails">
            <!-- Los detalles se cargarán aquí -->
        </div>

        <div class="d-flex gap-2 justify-content-end mt-4">
            <button class="btn btn-secondary" onclick="window.location.href='/estudiantes'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <button class="btn btn-success" onclick="editar()">
                <i class="fas fa-edit"></i> Editar
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');

    if (!token) window.location.href = '/login';

    document.getElementById('userName').textContent = userName || 'Admin';

    const urlParams = new URLSearchParams(window.location.search);
    const estudianteId = urlParams.get('id') || window.location.pathname.split('/').pop();

    async function cargarEstudiante() {
        try {
            const response = await axios.get(`http://localhost:8080/api/estudiantes/${estudianteId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const estudiante = response.data;

            const estadoBadge = estudiante.estado === 'ACTIVO'
                ? '<span class="badge-estado-activo">ACTIVO</span>'
                : '<span class="badge-estado-inactivo">INACTIVO</span>';

            const html = `
                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">ID</div>
                        <div class="col-md-8 detail-value">${estudiante.id}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Nombre Completo</div>
                        <div class="col-md-8 detail-value">
                            <strong>${estudiante.nombreCompleto}</strong>
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Cédula</div>
                        <div class="col-md-8 detail-value">${estudiante.cedula}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Email</div>
                        <div class="col-md-8 detail-value">
                            <a href="mailto:${estudiante.email}">${estudiante.email}</a>
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Teléfono</div>
                        <div class="col-md-8 detail-value">
                            ${estudiante.telefono ? `<a href="tel:${estudiante.telefono}">${estudiante.telefono}</a>` : '-'}
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Código de Estudiante</div>
                        <div class="col-md-8 detail-value">
                            <span class="badge-codigo">${estudiante.codigoEstudiante}</span>
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Carrera</div>
                        <div class="col-md-8 detail-value">${estudiante.carrera || '-'}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Semestre</div>
                        <div class="col-md-8 detail-value">${estudiante.semestre || '-'}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Fecha de Ingreso</div>
                        <div class="col-md-8 detail-value">${estudiante.fechaIngreso || '-'}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Usuario del Sistema</div>
                        <div class="col-md-8 detail-value">
                            <code>${estudiante.nombreUsuario}</code>
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Estado</div>
                        <div class="col-md-8 detail-value">${estadoBadge}</div>
                    </div>
                </div>
            `;

            document.getElementById('estudianteDetails').innerHTML = html;
            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            console.error('Error cargando estudiante:', error);
            document.getElementById('loadingOverlay').style.display = 'none';

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudo cargar la información del estudiante',
                confirmButtonColor: '#10b981'
            }).then(() => {
                window.location.href = '/estudiantes';
            });
        }
    }

    cargarEstudiante();

    function editar() {
        window.location.href = `/estudiantes/editar/${estudianteId}`;
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
