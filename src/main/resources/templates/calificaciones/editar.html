<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Calificación - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #059669, #10b981);
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        .user-info { color: white; }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .form-header {
            border-bottom: 3px solid #059669;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .btn-success {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #047857, #059669);
        }
        .char-counter {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        .nota-preview {
            background: #f0fdf4;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            border: 2px solid #10b981;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border" style="width: 3rem; height: 3rem; color: #059669;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando calificación...</p>
    </div>
</div>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="volverLista()">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-edit"></i> Editar Calificación
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h2><i class="fas fa-graduation-cap"></i> Editar Calificación</h2>
            <p class="text-muted mb-0">Modifica los datos de la calificación</p>
        </div>

        <form id="formEditarCalificacion">
            <input type="hidden" id="calificacionId">

            <!-- INSCRIPCIÓN (SOLO LECTURA) -->
            <div class="mb-4">
                <label class="form-label fw-bold">Inscripción</label>
                <input type="text" class="form-control" id="inscripcionNombre" readonly>
                <small class="text-muted">No se puede cambiar la inscripción</small>
            </div>

            <!-- NOMBRE EVALUACIÓN -->
            <div class="mb-4">
                <label for="nombreEvaluacion" class="form-label fw-bold">
                    Nombre de la Evaluación <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="nombreEvaluacion" maxlength="100" required>
                <div class="char-counter">
                    <span id="nombreCounter">0/100</span> caracteres
                </div>
            </div>

            <!-- NOTA -->
            <div class="mb-4">
                <label for="nota" class="form-label fw-bold">
                    Nota <span class="text-danger">*</span>
                </label>
                <input type="number" class="form-control" id="nota" min="0" max="5" step="0.1" required>
                <small class="text-muted">Entre 0.0 y 5.0 (Aprobación >= 3.0)</small>
            </div>

            <!-- PORCENTAJE -->
            <div class="mb-4">
                <label for="porcentaje" class="form-label fw-bold">
                    Porcentaje <span class="text-danger">*</span>
                </label>
                <input type="number" class="form-control" id="porcentaje" min="1" max="100" required>
                <small class="text-muted">Entre 1% y 100%</small>
            </div>

            <!-- PREVIEW DE NOTA PONDERADA -->
            <div class="nota-preview" id="notaPreview" style="display: none;">
                <h6><i class="fas fa-calculator"></i> Cálculo Actualizado</h6>
                <p class="mb-1"><strong>Nota Ponderada:</strong> <span id="notaPonderadaCalc">0.00</span></p>
                <p class="mb-0"><strong>Estado:</strong> <span id="estadoNota"></span></p>
            </div>

            <!-- OBSERVACIONES -->
            <div class="mb-4 mt-4">
                <label for="observaciones" class="form-label fw-bold">
                    Observaciones <span class="text-muted">(Opcional)</span>
                </label>
                <textarea class="form-control" id="observaciones" rows="3" maxlength="500"></textarea>
                <div class="char-counter">
                    <span id="observacionesCounter">0/500</span> caracteres
                </div>
            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2 justify-content-end mt-4">
                <button type="button" class="btn btn-secondary" onclick="cancelar()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');

    if (!token) window.location.href = '/login';
    document.getElementById('userName').textContent = userName || 'Admin';

    const urlParams = new URLSearchParams(window.location.search);
    const calificacionId = urlParams.get('id') || window.location.pathname.split('/').pop();

    let formModificado = false;
    let guardandoFormulario = false;
    let calificacionOriginal = null;
    let inscripcionId = null;

    async function cargarCalificacion() {
        try {
            const response = await axios.get(`http://localhost:8080/api/calificaciones/${calificacionId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            calificacionOriginal = response.data;
            inscripcionId = calificacionOriginal.inscripcionId;

            // Llenar formulario
            document.getElementById('calificacionId').value = calificacionOriginal.id;
            document.getElementById('nombreEvaluacion').value = calificacionOriginal.nombreEvaluacion;
            document.getElementById('nota').value = calificacionOriginal.nota;
            document.getElementById('porcentaje').value = calificacionOriginal.porcentaje;
            document.getElementById('observaciones').value = calificacionOriginal.observaciones || '';

            // Actualizar contadores
            document.getElementById('nombreCounter').textContent = `${calificacionOriginal.nombreEvaluacion.length}/100`;
            document.getElementById('observacionesCounter').textContent = `${(calificacionOriginal.observaciones || '').length}/500`;

            // Mostrar inscripción (solo lectura - necesitaríamos otro endpoint para obtener el nombre)
            document.getElementById('inscripcionNombre').value = 'Inscripción ID: ' + calificacionId;

            calcularNotaPonderada();

            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            console.error('Error cargando calificación:', error);
            document.getElementById('loadingOverlay').style.display = 'none';

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudo cargar la calificación',
                confirmButtonColor: '#059669'
            }).then(() => {
                window.location.href = '/calificaciones';
            });
        }
    }

    cargarCalificacion();

    // Contadores
    document.getElementById('nombreEvaluacion').addEventListener('input', function(e) {
        document.getElementById('nombreCounter').textContent = `${e.target.value.length}/100`;
        formModificado = true;
    });

    document.getElementById('observaciones').addEventListener('input', function(e) {
        document.getElementById('observacionesCounter').textContent = `${e.target.value.length}/500`;
        formModificado = true;
    });

    // Calcular nota ponderada en tiempo real
    function calcularNotaPonderada() {
        const nota = parseFloat(document.getElementById('nota').value) || 0;
        const porcentaje = parseInt(document.getElementById('porcentaje').value) || 0;

        if (nota > 0 && porcentaje > 0) {
            const notaPonderada = (nota * porcentaje / 100).toFixed(2);
            document.getElementById('notaPonderadaCalc').textContent = notaPonderada;

            const estado = nota >= 3.0
                ? '<span class="text-success"><i class="fas fa-check"></i> APROBADA</span>'
                : '<span class="text-danger"><i class="fas fa-times"></i> REPROBADA</span>';
            document.getElementById('estadoNota').innerHTML = estado;

            document.getElementById('notaPreview').style.display = 'block';
        } else {
            document.getElementById('notaPreview').style.display = 'none';
        }
    }

    document.getElementById('nota').addEventListener('input', function() {
        calcularNotaPonderada();
        formModificado = true;
    });

    document.getElementById('porcentaje').addEventListener('input', function() {
        calcularNotaPonderada();
        formModificado = true;
    });

    // Enviar formulario
    document.getElementById('formEditarCalificacion').addEventListener('submit', async function(e) {
        e.preventDefault();

        const nombreEvaluacion = document.getElementById('nombreEvaluacion').value.trim();
        const nota = parseFloat(document.getElementById('nota').value);
        const porcentaje = parseInt(document.getElementById('porcentaje').value);
        const observaciones = document.getElementById('observaciones').value.trim();

        if (!nombreEvaluacion || !nota || !porcentaje) {
            Swal.fire({
                icon: 'warning',
                title: 'Campos incompletos',
                text: 'Completa todos los campos obligatorios',
                confirmButtonColor: '#059669'
            });
            return;
        }

        if (nota < 0 || nota > 5) {
            Swal.fire({
                icon: 'warning',
                title: 'Nota inválida',
                text: 'La nota debe estar entre 0.0 y 5.0',
                confirmButtonColor: '#059669'
            });
            return;
        }

        const result = await Swal.fire({
            title: '¿Guardar cambios?',
            text: 'Se actualizará la información de la calificación',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, guardar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#059669'
        });

        if (result.isConfirmed) {
            document.getElementById('loadingOverlay').querySelector('p').textContent = 'Guardando cambios...';
            document.getElementById('loadingOverlay').style.display = 'flex';
            guardandoFormulario = true;

            try {
                const datos = {
                    inscripcionId: inscripcionId, // Necesitaríamos obtener esto del backend
                    nombreEvaluacion: nombreEvaluacion,
                    nota: nota,
                    porcentaje: porcentaje,
                    observaciones: observaciones || null
                };

                await axios.put(
                    `http://localhost:8080/api/calificaciones/${calificacionId}`,
                    datos,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                document.getElementById('loadingOverlay').style.display = 'none';

                Swal.fire({
                    icon: 'success',
                    title: '¡Cambios guardados!',
                    text: 'La calificación fue actualizada correctamente',
                    confirmButtonColor: '#059669'
                }).then(() => {
                    window.location.href = '/calificaciones';
                });

            } catch (error) {
                document.getElementById('loadingOverlay').style.display = 'none';
                guardandoFormulario = false;

                let mensajeError = 'No se pudieron guardar los cambios';

                if (error.response?.data?.message?.includes('porcentajes excede 100')) {
                    mensajeError = error.response.data.message;
                } else if (error.response?.data?.message) {
                    mensajeError = error.response.data.message;
                }

                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensajeError,
                    confirmButtonColor: '#059669'
                });
            }
        }
    });

    function cancelar() {
        if (formModificado) {
            Swal.fire({
                title: '¿Descartar cambios?',
                text: 'Se perderán las modificaciones realizadas',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, descartar',
                cancelButtonText: 'Continuar editando',
                confirmButtonColor: '#dc2626'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/calificaciones';
                }
            });
        } else {
            window.location.href = '/calificaciones';
        }
    }

    function volverLista() {
        cancelar();
    }

    window.addEventListener('beforeunload', function(e) {
        if (formModificado && !guardandoFormulario) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
