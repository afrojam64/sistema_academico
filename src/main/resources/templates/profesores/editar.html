<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Profesor - Sistema Académico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #f59e0b, #fb923c);
        }
        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }
        .user-info {
            color: white;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .form-header {
            border-bottom: 3px solid #f59e0b;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #fb923c);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        .char-counter {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando datos del profesor...</p>
    </div>
</div>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="volverLista()">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-edit"></i> Editar Profesor
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h2><i class="fas fa-chalkboard-teacher"></i> Editar Información del Profesor</h2>
            <p class="text-muted mb-0">Modifica los campos necesarios</p>
        </div>

        <form id="formEditarProfesor">
            <input type="hidden" id="profesorId">

            <!-- NOMBRE -->
            <div class="mb-4">
                <label for="nombre" class="form-label fw-bold">
                    Nombre <span class="text-danger">*</span>
                </label>
                <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        maxlength="100"
                        required>
                <div class="char-counter">
                    <span id="nombreCounter">0/100</span> caracteres
                </div>
            </div>

            <!-- APELLIDO -->
            <div class="mb-4">
                <label for="apellido" class="form-label fw-bold">
                    Apellido <span class="text-danger">*</span>
                </label>
                <input
                        type="text"
                        class="form-control"
                        id="apellido"
                        maxlength="100"
                        required>
                <div class="char-counter">
                    <span id="apellidoCounter">0/100</span> caracteres
                </div>
            </div>

            <!-- CÉDULA -->
            <div class="mb-4">
                <label for="cedula" class="form-label fw-bold">
                    Cédula <span class="text-danger">*</span>
                </label>
                <input
                        type="text"
                        class="form-control"
                        id="cedula"
                        maxlength="20"
                        required>
                <div class="char-counter">
                    <span id="cedulaCounter">0/20</span> caracteres
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-4">
                <label for="email" class="form-label fw-bold">
                    Email <span class="text-danger">*</span>
                </label>
                <input
                        type="email"
                        class="form-control"
                        id="email"
                        maxlength="150"
                        required>
            </div>

            <!-- TELÉFONO -->
            <div class="mb-4">
                <label for="telefono" class="form-label fw-bold">
                    Teléfono <span class="text-muted">(Opcional)</span>
                </label>
                <input
                        type="text"
                        class="form-control"
                        id="telefono"
                        maxlength="20">
                <div class="char-counter">
                    <span id="telefonoCounter">0/20</span> caracteres
                </div>
            </div>

            <!-- ESPECIALIDAD -->
            <div class="mb-4">
                <label for="especialidad" class="form-label fw-bold">
                    Especialidad <span class="text-muted">(Opcional)</span>
                </label>
                <input
                        type="text"
                        class="form-control"
                        id="especialidad"
                        maxlength="200">
                <div class="char-counter">
                    <span id="especialidadCounter">0/200</span> caracteres
                </div>
            </div>

            <!-- DEPARTAMENTO -->
            <div class="mb-4">
                <label for="departamentoId" class="form-label fw-bold">
                    Departamento <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="departamentoId" required>
                    <option value="">Selecciona un departamento</option>
                </select>
            </div>

            <!-- FECHA DE CONTRATACIÓN -->
            <div class="mb-4">
                <label for="fechaContratacion" class="form-label fw-bold">
                    Fecha de Contratación
                </label>
                <input
                        type="date"
                        class="form-control"
                        id="fechaContratacion">
            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2 justify-content-end mt-4">
                <button type="button" class="btn btn-secondary" onclick="cancelar()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    const userRole = localStorage.getItem('userRole');

    if (!token) window.location.href = '/login';

    document.getElementById('userName').textContent = userName || 'Admin';

    // Obtener ID del profesor de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const profesorId = urlParams.get('id') || window.location.pathname.split('/').pop();

    let formModificado = false;
    let guardandoFormulario = false;

    // ========================================
    // CARGAR DATOS
    // ========================================
    async function cargarDatos() {
        try {
            // Cargar departamentos
            const deptosResponse = await axios.get('http://localhost:8080/api/departamentos', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const selectDepto = document.getElementById('departamentoId');
            const deptosActivos = deptosResponse.data.filter(d => d.estado === 'ACTIVO');

            deptosActivos.forEach(depto => {
                const option = document.createElement('option');
                option.value = depto.id;
                option.textContent = `${depto.codigo} - ${depto.nombre}`;
                selectDepto.appendChild(option);
            });

            // Cargar datos del profesor
            const profesorResponse = await axios.get(`http://localhost:8080/api/profesores/${profesorId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const profesor = profesorResponse.data;

            // Llenar formulario
            document.getElementById('profesorId').value = profesor.id;
            document.getElementById('nombre').value = profesor.nombre;
            document.getElementById('apellido').value = profesor.apellido;
            document.getElementById('cedula').value = profesor.cedula;
            document.getElementById('email').value = profesor.email;
            document.getElementById('telefono').value = profesor.telefono || '';
            document.getElementById('especialidad').value = profesor.especialidad || '';
            document.getElementById('departamentoId').value = profesor.departamentoId;
            document.getElementById('fechaContratacion').value = profesor.fechaContratacion ?
                formatearFechaParaInput(profesor.fechaContratacion) : '';

            // Actualizar contadores
            document.getElementById('nombreCounter').textContent = `${profesor.nombre.length}/100`;
            document.getElementById('apellidoCounter').textContent = `${profesor.apellido.length}/100`;
            document.getElementById('cedulaCounter').textContent = `${profesor.cedula.length}/20`;
            document.getElementById('telefonoCounter').textContent = `${(profesor.telefono || '').length}/20`;
            document.getElementById('especialidadCounter').textContent = `${(profesor.especialidad || '').length}/200`;

            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            console.error('Error cargando datos:', error);
            document.getElementById('loadingOverlay').style.display = 'none';

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudieron cargar los datos del profesor',
                confirmButtonColor: '#f59e0b'
            }).then(() => {
                window.location.href = '/profesores';
            });
        }
    }

    function formatearFechaParaInput(fechaStr) {
        // Convierte DD/MM/YYYY a YYYY-MM-DD
        const partes = fechaStr.split('/');
        if (partes.length === 3) {
            return `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
        return fechaStr;
    }

    cargarDatos();

    // ========================================
    // CONTADORES Y EVENTOS
    // ========================================
    document.getElementById('nombre').addEventListener('input', function(e) {
        document.getElementById('nombreCounter').textContent = `${e.target.value.length}/100`;
        formModificado = true;
    });

    document.getElementById('apellido').addEventListener('input', function(e) {
        document.getElementById('apellidoCounter').textContent = `${e.target.value.length}/100`;
        formModificado = true;
    });

    document.getElementById('cedula').addEventListener('input', function(e) {
        document.getElementById('cedulaCounter').textContent = `${e.target.value.length}/20`;
        formModificado = true;
    });

    document.getElementById('telefono').addEventListener('input', function(e) {
        document.getElementById('telefonoCounter').textContent = `${e.target.value.length}/20`;
        formModificado = true;
    });

    document.getElementById('especialidad').addEventListener('input', function(e) {
        document.getElementById('especialidadCounter').textContent = `${e.target.value.length}/200`;
        formModificado = true;
    });

    ['email', 'departamentoId', 'fechaContratacion'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => formModificado = true);
    });

    // ========================================
    // ENVIAR FORMULARIO
    // ========================================
    document.getElementById('formEditarProfesor').addEventListener('submit', async function(e) {
        e.preventDefault();

        const datos = {
            nombre: document.getElementById('nombre').value.trim(),
            apellido: document.getElementById('apellido').value.trim(),
            cedula: document.getElementById('cedula').value.trim(),
            email: document.getElementById('email').value.trim(),
            telefono: document.getElementById('telefono').value.trim() || null,
            especialidad: document.getElementById('especialidad').value.trim() || null,
            departamentoId: parseInt(document.getElementById('departamentoId').value),
            fechaContratacion: document.getElementById('fechaContratacion').value || null
        };

        // Validaciones
        if (!datos.nombre || !datos.apellido || !datos.cedula || !datos.email || !datos.departamentoId) {
            Swal.fire({
                icon: 'warning',
                title: 'Campos incompletos',
                text: 'Por favor completa todos los campos obligatorios',
                confirmButtonColor: '#f59e0b'
            });
            return;
        }

        // Confirmación
        const result = await Swal.fire({
            title: '¿Guardar cambios?',
            text: 'Se actualizará la información del profesor',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, guardar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#f59e0b'
        });

        if (result.isConfirmed) {
            document.getElementById('loadingOverlay').querySelector('p').textContent = 'Guardando cambios...';
            document.getElementById('loadingOverlay').style.display = 'flex';
            guardandoFormulario = true;

            try {
                await axios.put(
                    `http://localhost:8080/api/profesores/${profesorId}`,
                    datos,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                document.getElementById('loadingOverlay').style.display = 'none';

                Swal.fire({
                    icon: 'success',
                    title: '¡Cambios guardados!',
                    text: 'La información del profesor fue actualizada correctamente',
                    confirmButtonColor: '#f59e0b'
                }).then(() => {
                    window.location.href = '/profesores';
                });

            } catch (error) {
                document.getElementById('loadingOverlay').style.display = 'none';
                guardandoFormulario = false;

                let mensajeError = 'No se pudieron guardar los cambios';

                if (error.response?.data?.message?.includes('email')) {
                    mensajeError = 'Ya existe un profesor con ese email';
                } else if (error.response?.data?.message?.includes('cedula') ||
                    error.response?.data?.message?.includes('cédula')) {
                    mensajeError = 'Ya existe un profesor con esa cédula';
                } else if (error.response?.data?.message) {
                    mensajeError = error.response.data.message;
                }

                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensajeError,
                    confirmButtonColor: '#f59e0b'
                });
            }
        }
    });

    function cancelar() {
        if (formModificado) {
            Swal.fire({
                title: '¿Descartar cambios?',
                text: 'Se perderán las modificaciones realizadas',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, descartar',
                cancelButtonText: 'Continuar editando',
                confirmButtonColor: '#dc2626'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/profesores';
                }
            });
        } else {
            window.location.href = '/profesores';
        }
    }

    function volverLista() {
        cancelar();
    }

    window.addEventListener('beforeunload', function(e) {
        if (formModificado && !guardandoFormulario) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
