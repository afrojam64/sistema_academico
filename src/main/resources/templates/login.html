<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .logo i {
            font-size: 40px;
            color: white;
        }
        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }
        .btn-login {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 12px;
            font-weight: 600;
            border: none;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <i class="fas fa-graduation-cap"></i>
    </div>
    <h1>Sistema Académico</h1>
    <p class="subtitle">Bienvenido de nuevo</p>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label"><i class="fas fa-user"></i> Usuario</label>
            <input type="text" class="form-control" id="usuario">
        </div>

        <div class="mb-3">
            <label class="form-label"><i class="fas fa-lock"></i> Contraseña</label>
            <input type="password" class="form-control" id="password">
        </div>

        <button type="submit" class="btn btn-login w-100">Iniciar Sesión</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const usuario = document.getElementById('usuario').value;
        const password = document.getElementById('password').value;

        try {
            const response = await axios.post('http://localhost:8080/auth/login', {
                nombreUsuario: usuario,
                contrasena: password
            });

            // Guardar datos básicos en localStorage
            localStorage.setItem('token', response.data.token);
            localStorage.setItem('userName', response.data.nombreUsuario);
            localStorage.setItem('userRole', response.data.rol);
            localStorage.setItem('userId', response.data.id);
            localStorage.setItem('userEmail', response.data.email);

            // ========================================
            // GUARDAR profesorId o estudianteId
            // ========================================
            if (response.data.profesorId) {
                localStorage.setItem('profesorId', response.data.profesorId);
                console.log('✅ Profesor ID guardado:', response.data.profesorId);
            }

            if (response.data.estudianteId) {
                localStorage.setItem('estudianteId', response.data.estudianteId);
                console.log('✅ Estudiante ID guardado:', response.data.estudianteId);
            }

            // Mostrar mensaje de éxito
            Swal.fire({
                icon: 'success',
                title: '¡Bienvenido!',
                text: 'Hola ' + response.data.nombreUsuario,
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                // Obtener el rol para redireccionar
                const rol = response.data.rol;

                // Normalizar el rol recibido
                const rolNormalizado = rol.toUpperCase().trim();

                console.log('Usuario:', response.data.nombreUsuario);
                console.log('Rol recibido:', rolNormalizado);

                // Redireccionar según el rol
                switch(rolNormalizado) {
                    case 'SUPER_ADMIN':
                        console.log('→ Redirigiendo a dashboard SUPER_ADMIN');
                        window.location.href = '/dashboard/super-admin';
                        break;

                    case 'ADMIN':
                        console.log('→ Redirigiendo a dashboard ADMIN');
                        window.location.href = '/dashboard/admin';
                        break;

                    case 'PROFESOR':
                        console.log('→ Redirigiendo a dashboard PROFESOR');
                        window.location.href = '/dashboard/profesor';
                        break;

                    case 'ESTUDIANTE':
                        console.log('→ Redirigiendo a dashboard ESTUDIANTE');
                        window.location.href = '/dashboard/estudiante';
                        break;

                    default:
                        console.warn('⚠️ Rol no reconocido:', rolNormalizado);
                        console.log('→ Redirigiendo a dashboard por defecto');
                        window.location.href = '/dashboard/admin';
                        break;
                }
            });

        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Usuario o contraseña incorrectos'
            });
        }
    });
</script>
</body>
</html>
