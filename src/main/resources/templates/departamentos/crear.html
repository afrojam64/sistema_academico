<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Departamento - Sistema Académico</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #059669, #10b981);
        }
        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }
        .user-info {
            color: white;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .form-header {
            border-bottom: 3px solid #10b981;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .form-header h2 {
            color: #059669;
            margin: 0;
        }
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .required::after {
            content: " *";
            color: #dc2626;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.25);
        }
        .form-control.is-invalid {
            border-color: #dc2626;
        }
        .form-control.is-valid {
            border-color: #10b981;
        }
        .invalid-feedback {
            display: block;
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
        }
        .char-counter {
            font-size: 12px;
            color: #6b7280;
            text-align: right;
            margin-top: 5px;
        }
        .btn-guardar {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 8px;
        }
        .btn-guardar:hover {
            background: linear-gradient(135deg, #047857, #059669);
            color: white;
        }
        .btn-cancelar {
            background: #6b7280;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 8px;
        }
        .btn-cancelar:hover {
            background: #4b5563;
            color: white;
        }
        .form-section {
            background: #f9fafb;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }
        .section-title {
            color: #059669;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="volver()">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-building"></i> Crear Nuevo Departamento
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <!-- Encabezado -->
        <div class="form-header">
            <h2>
                <i class="fas fa-plus-circle"></i>
                Nuevo Departamento
            </h2>
            <p class="text-muted mb-0">Complete los datos del nuevo departamento</p>
        </div>

        <!-- Formulario -->
        <form id="formCrearDepartamento" novalidate>

            <!-- Sección: Información Básica -->
            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-info-circle"></i>
                    Información Básica
                </div>

                <!-- Código -->
                <div class="mb-4">
                    <label for="codigo" class="form-label required">Código del Departamento</label>
                    <input
                            type="text"
                            class="form-control"
                            id="codigo"
                            placeholder="Ej: ING, MAT, FIS"
                            maxlength="10"
                            required
                    >
                    <div class="invalid-feedback" id="codigoError"></div>
                    <div class="char-counter">
                        <span id="codigoCount">0</span>/10 caracteres
                    </div>
                    <small class="text-muted">
                        <i class="fas fa-info-circle"></i>
                        Código único de 2-10 caracteres (se recomienda usar mayúsculas)
                    </small>
                </div>

                <!-- Nombre -->
                <div class="mb-4">
                    <label for="nombre" class="form-label required">Nombre del Departamento</label>
                    <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            placeholder="Ej: Ingeniería de Sistemas"
                            maxlength="100"
                            required
                    >
                    <div class="invalid-feedback" id="nombreError"></div>
                    <div class="char-counter">
                        <span id="nombreCount">0</span>/100 caracteres
                    </div>
                </div>

                <!-- Descripción -->
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción (Opcional)</label>
                    <textarea
                            class="form-control"
                            id="descripcion"
                            rows="4"
                            placeholder="Descripción detallada del departamento..."
                            maxlength="500"
                    ></textarea>
                    <div class="char-counter">
                        <span id="descripcionCount">0</span>/500 caracteres
                    </div>
                    <small class="text-muted">
                        <i class="fas fa-info-circle"></i>
                        Información adicional sobre el departamento (opcional)
                    </small>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="d-flex gap-3 justify-content-end">
                <button type="button" class="btn btn-cancelar" onclick="volver()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-guardar">
                    <i class="fas fa-save"></i> Guardar Departamento
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // ========================================
    // VARIABLES GLOBALES
    // ========================================

    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    const userRole = localStorage.getItem('userRole');

    // Verificar autenticación
    if (!token) {
        window.location.href = '/login';
    }

    // Mostrar nombre de usuario
    document.getElementById('userName').textContent = userName || 'Admin';

    // ========================================
    // CONTADORES DE CARACTERES
    // ========================================

    document.getElementById('codigo').addEventListener('input', function() {
        document.getElementById('codigoCount').textContent = this.value.length;
    });

    document.getElementById('nombre').addEventListener('input', function() {
        document.getElementById('nombreCount').textContent = this.value.length;
    });

    document.getElementById('descripcion').addEventListener('input', function() {
        document.getElementById('descripcionCount').textContent = this.value.length;
    });

    // ========================================
    // VALIDACIONES EN TIEMPO REAL
    // ========================================

    // Validar código
    document.getElementById('codigo').addEventListener('blur', function() {
        validarCodigo();
    });

    document.getElementById('codigo').addEventListener('input', function() {
        // Convertir a mayúsculas automáticamente
        this.value = this.value.toUpperCase();

        // Limpiar error si está escribiendo
        if (this.value.length >= 2) {
            this.classList.remove('is-invalid');
        }
    });

    // Validar nombre
    document.getElementById('nombre').addEventListener('blur', function() {
        validarNombre();
    });

    document.getElementById('nombre').addEventListener('input', function() {
        // Limpiar error si está escribiendo
        if (this.value.length >= 3) {
            this.classList.remove('is-invalid');
        }
    });

    // ========================================
    // FUNCIONES DE VALIDACIÓN
    // ========================================

    function validarCodigo() {
        const codigo = document.getElementById('codigo');
        const codigoError = document.getElementById('codigoError');
        const valor = codigo.value.trim();

        if (valor.length === 0) {
            codigo.classList.add('is-invalid');
            codigo.classList.remove('is-valid');
            codigoError.textContent = 'El código es obligatorio';
            return false;
        }

        if (valor.length < 2) {
            codigo.classList.add('is-invalid');
            codigo.classList.remove('is-valid');
            codigoError.textContent = 'El código debe tener al menos 2 caracteres';
            return false;
        }

        if (valor.length > 10) {
            codigo.classList.add('is-invalid');
            codigo.classList.remove('is-valid');
            codigoError.textContent = 'El código no puede exceder 10 caracteres';
            return false;
        }

        // Validar que solo contenga letras y números
        const regex = /^[A-Z0-9]+$/;
        if (!regex.test(valor)) {
            codigo.classList.add('is-invalid');
            codigo.classList.remove('is-valid');
            codigoError.textContent = 'El código solo puede contener letras mayúsculas y números';
            return false;
        }

        codigo.classList.remove('is-invalid');
        codigo.classList.add('is-valid');
        return true;
    }

    function validarNombre() {
        const nombre = document.getElementById('nombre');
        const nombreError = document.getElementById('nombreError');
        const valor = nombre.value.trim();

        if (valor.length === 0) {
            nombre.classList.add('is-invalid');
            nombre.classList.remove('is-valid');
            nombreError.textContent = 'El nombre es obligatorio';
            return false;
        }

        if (valor.length < 3) {
            nombre.classList.add('is-invalid');
            nombre.classList.remove('is-valid');
            nombreError.textContent = 'El nombre debe tener al menos 3 caracteres';
            return false;
        }

        if (valor.length > 100) {
            nombre.classList.add('is-invalid');
            nombre.classList.remove('is-valid');
            nombreError.textContent = 'El nombre no puede exceder 100 caracteres';
            return false;
        }

        nombre.classList.remove('is-invalid');
        nombre.classList.add('is-valid');
        return true;
    }

    function validarFormulario() {
        const codigoValido = validarCodigo();
        const nombreValido = validarNombre();

        return codigoValido && nombreValido;
    }

    // ========================================
    // ENVÍO DEL FORMULARIO
    // ========================================

    document.getElementById('formCrearDepartamento').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Validar formulario
        if (!validarFormulario()) {
            Swal.fire({
                icon: 'warning',
                title: 'Validación',
                text: 'Por favor, completa todos los campos obligatorios correctamente',
                confirmButtonColor: '#10b981'
            });
            return;
        }

        // Construir objeto con los datos
        const nuevoDepartamento = {
            codigo: document.getElementById('codigo').value.trim(),
            nombre: document.getElementById('nombre').value.trim(),
            descripcion: document.getElementById('descripcion').value.trim() || null
        };

        // Confirmar creación
        const result = await Swal.fire({
            title: '¿Crear departamento?',
            html: `
                <div style="text-align: left; margin: 20px;">
                    <p><strong>Código:</strong> ${nuevoDepartamento.codigo}</p>
                    <p><strong>Nombre:</strong> ${nuevoDepartamento.nombre}</p>
                    <p><strong>Descripción:</strong> ${nuevoDepartamento.descripcion || '<i>Sin descripción</i>'}</p>
                </div>
            `,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, crear',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#10b981'
        });

        if (result.isConfirmed) {
            try {
                // Mostrar loading
                Swal.fire({
                    title: 'Creando departamento...',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                // Enviar a la API
                const response = await axios.post(
                    'http://localhost:8080/api/departamentos',
                    nuevoDepartamento,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                // Éxito
                Swal.fire({
                    icon: 'success',
                    title: '¡Departamento creado!',
                    text: 'El departamento se creó correctamente',
                    confirmButtonColor: '#10b981'
                }).then(() => {
                    guardandoFormulario = true;
                    window.location.href = '/departamentos';
                });

            } catch (error) {
                console.error('Error creando departamento:', error);

                let mensajeError = 'No se pudo crear el departamento';

                if (error.response?.data?.message) {
                    mensajeError = error.response.data.message;
                } else if (error.response?.status === 400) {
                    mensajeError = 'Datos inválidos. Verifica la información ingresada';
                } else if (error.response?.status === 409) {
                    mensajeError = 'Ya existe un departamento con ese código';
                }

                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensajeError,
                    confirmButtonColor: '#10b981'
                });
            }
        }
    });

    // ========================================
    // NAVEGACIÓN
    // ========================================

    function volver() {
        // Verificar si hay cambios sin guardar
        const codigo = document.getElementById('codigo').value.trim();
        const nombre = document.getElementById('nombre').value.trim();
        const descripcion = document.getElementById('descripcion').value.trim();

        if (codigo || nombre || descripcion) {
            Swal.fire({
                title: '¿Descartar cambios?',
                text: 'Hay cambios sin guardar. ¿Deseas salir de todos modos?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#dc2626'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/departamentos';
                }
            });
        } else {
            window.location.href = '/departamentos';
        }
    }

    function logout() {
        Swal.fire({
            title: '¿Cerrar sesión?',
            text: '¿Estás seguro que deseas salir?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, salir',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#10b981'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.clear();
                window.location.href = '/login';
            }
        });
    }

    // Variable para controlar si se está guardando
    let guardandoFormulario = false;

    // Prevenir salida accidental con cambios sin guardar
    window.addEventListener('beforeunload', function(e) {
        //Si está guardado no mostrar alerta
        if (guardandoFormulario){
            return;
        }
        const codigo = document.getElementById('codigo').value.trim();
        const nombre = document.getElementById('nombre').value.trim();
        const descripcion = document.getElementById('descripcion').value.trim();

        if (codigo || nombre || descripcion) {
            e.preventDefault();
            e.returnValue = '';
        }
    });
</script>

</body>
</html>
