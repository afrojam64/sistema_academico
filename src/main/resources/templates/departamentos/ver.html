<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Departamento - Sistema Académico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #059669, #10b981);
        }
        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }
        .user-info {
            color: white;
        }
        .detail-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .detail-header {
            border-bottom: 3px solid #10b981;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .detail-header h2 {
            color: #059669;
            margin: 0;
        }
        .detail-section {
            margin-bottom: 35px;
        }
        .detail-section-title {
            color: #059669;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            font-weight: 600;
            color: #64748b;
            min-width: 200px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-value {
            color: #1e293b;
            flex: 1;
        }
        .empty-value {
            color: #94a3b8;
            font-style: italic;
        }
        .badge-activo {
            background: #dcfce7;
            color: #15803d;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .badge-inactivo {
            background: #fee2e2;
            color: #991b1b;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e5e7eb;
        }
        .btn-action {
            padding: 12px 25px;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #047857, #059669);
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando datos del departamento...</p>
    </div>
</div>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="volverLista()">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-building"></i> Detalles del Departamento
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="detail-container">
        <div class="detail-header">
            <div>
                <h2>
                    <i class="fas fa-building"></i>
                    <span id="nombreDepartamento">Cargando...</span>
                </h2>
                <p class="text-muted mb-0">
                    Código: <strong id="codigoDepartamento">...</strong>
                </p>
            </div>
            <div class="text-end">
                <div id="estadoBadge"></div>
            </div>
        </div>

        <div class="detail-section">
            <div class="detail-section-title">
                <i class="fas fa-info-circle"></i>
                Información General
            </div>

            <div class="detail-row">
                <div class="detail-label">
                    <i class="fas fa-hashtag"></i>
                    ID del Departamento
                </div>
                <div class="detail-value" id="departamentoId">-</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">
                    <i class="fas fa-tag"></i>
                    Código
                </div>
                <div class="detail-value" id="codigo">-</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">
                    <i class="fas fa-building"></i>
                    Nombre del Departamento
                </div>
                <div class="detail-value" id="nombre">-</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">
                    <i class="fas fa-align-left"></i>
                    Descripción
                </div>
                <div class="detail-value" id="descripcion">-</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">
                    <i class="fas fa-toggle-on"></i>
                    Estado
                </div>
                <div class="detail-value" id="estadoTexto">-</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary btn-action" onclick="editarDepartamento()">
                <i class="fas fa-edit"></i> Editar Departamento
            </button>

            <button class="btn btn-warning btn-action" id="btnToggleEstado" onclick="toggleEstado()">
                <i class="fas fa-ban"></i> <span id="textoToggleEstado">Desactivar</span>
            </button>

            <button class="btn btn-danger btn-action" id="btnEliminar" onclick="eliminarDepartamento()" style="display: none;">
                <i class="fas fa-trash"></i> Eliminar Departamento
            </button>

            <button class="btn btn-secondary btn-action" onclick="volverLista()">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    const userRole = localStorage.getItem('userRole');

    if (!token) window.location.href = '/login';

    document.getElementById('userName').textContent = userName || 'Admin';

    const departamentoId = window.location.pathname.split('/').pop();
    let departamentoActual = null;

    window.addEventListener('DOMContentLoaded', cargarDepartamento);

    async function cargarDepartamento() {
        if (!departamentoId || departamentoId === 'ver') {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se especificó el ID del departamento',
                confirmButtonColor: '#10b981'
            }).then(() => window.location.href = '/departamentos');
            return;
        }

        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
            const response = await axios.get(
                `http://localhost:8080/api/departamentos/${departamentoId}`,
                { headers: { 'Authorization': `Bearer ${token}` } }
            );

            departamentoActual = response.data;
            mostrarDatosDepartamento(departamentoActual);
            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            document.getElementById('loadingOverlay').style.display = 'none';
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: error.response?.data?.message || 'No se pudo cargar el departamento',
                confirmButtonColor: '#10b981'
            }).then(() => window.location.href = '/departamentos');
        }
    }

    function mostrarDatosDepartamento(departamento) {
        document.getElementById('nombreDepartamento').textContent = departamento.nombre || 'Sin nombre';
        document.getElementById('codigoDepartamento').textContent = departamento.codigo || 'N/A';
        document.getElementById('estadoBadge').innerHTML = getEstadoBadge(departamento.estado);

        document.getElementById('departamentoId').textContent = departamento.id;
        document.getElementById('codigo').textContent = departamento.codigo || '-';
        document.getElementById('nombre').textContent = departamento.nombre || '-';
        document.getElementById('descripcion').innerHTML = departamento.descripcion
            ? departamento.descripcion
            : '<span class="empty-value">Sin descripción</span>';
        document.getElementById('estadoTexto').textContent = departamento.estado || '-';

        const btnToggle = document.getElementById('btnToggleEstado');
        if (departamento.estado === 'ACTIVO') {
            btnToggle.className = 'btn btn-warning btn-action';
            btnToggle.innerHTML = '<i class="fas fa-ban"></i> <span id="textoToggleEstado">Desactivar</span>';
        } else {
            btnToggle.className = 'btn btn-success btn-action';
            btnToggle.innerHTML = '<i class="fas fa-check-circle"></i> <span id="textoToggleEstado">Activar</span>';
        }

        if (userRole === 'SUPER_ADMIN') {
            document.getElementById('btnEliminar').style.display = 'inline-flex';
        }
    }

    function getEstadoBadge(estado) {
        return estado === 'ACTIVO'
            ? '<span class="badge-activo"><i class="fas fa-check-circle"></i> ACTIVO</span>'
            : '<span class="badge-inactivo"><i class="fas fa-times-circle"></i> INACTIVO</span>';
    }

    function editarDepartamento() {
        window.location.href = `/departamentos/editar/${departamentoId}`;
    }

    async function toggleEstado() {
        const esActivo = departamentoActual.estado === 'ACTIVO';
        const accion = esActivo ? 'desactivar' : 'activar';
        const endpoint = esActivo ? 'desactivar' : 'activar';

        const result = await Swal.fire({
            title: `¿${accion.charAt(0).toUpperCase() + accion.slice(1)} departamento?`,
            text: `¿Estás seguro de ${accion} el departamento "${departamentoActual.nombre}"?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: `Sí, ${accion}`,
            cancelButtonText: 'Cancelar',
            confirmButtonColor: esActivo ? '#f59e0b' : '#10b981'
        });

        if (result.isConfirmed) {
            try {
                await axios.patch(
                    `http://localhost:8080/api/departamentos/${departamentoId}/${endpoint}?rolUsuario=${userRole}`,
                    {},
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: `Departamento ${accion === 'activar' ? 'activado' : 'desactivado'} correctamente`,
                    confirmButtonColor: '#10b981'
                }).then(() => cargarDepartamento());

            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.response?.data?.message || `No se pudo ${accion} el departamento`,
                    confirmButtonColor: '#10b981'
                });
            }
        }
    }

    async function eliminarDepartamento() {
        const result = await Swal.fire({
            title: '¿Eliminar departamento?',
            html: `
                <div style="text-align: left; margin: 20px;">
                    <p>Esta acción es <strong style="color: #dc2626;">IRREVERSIBLE</strong>.</p>
                    <p>Se eliminará permanentemente:</p>
                    <ul style="margin-top: 15px;">
                        <li><strong>Código:</strong> ${departamentoActual.codigo}</li>
                        <li><strong>Nombre:</strong> ${departamentoActual.nombre}</li>
                    </ul>
                    <p style="margin-top: 15px; color: #dc2626;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Advertencia:</strong> Si este departamento tiene materias asociadas, no podrá eliminarse.
                    </p>
                    <p style="margin-top: 15px;">Escribe <strong>CONFIRMAR</strong> para continuar:</p>
                </div>
            `,
            icon: 'warning',
            input: 'text',
            inputPlaceholder: 'Escribe CONFIRMAR',
            showCancelButton: true,
            confirmButtonText: 'Eliminar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#dc2626',
            inputValidator: (value) => {
                if (value !== 'CONFIRMAR') return 'Debes escribir CONFIRMAR para continuar';
            }
        });

        if (result.isConfirmed) {
            try {
                Swal.fire({
                    title: 'Eliminando departamento...',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });

                await axios.delete(
                    `http://localhost:8080/api/departamentos/${departamentoId}?rolUsuario=${userRole}`,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: 'Departamento eliminado',
                    text: 'El departamento fue eliminado permanentemente',
                    confirmButtonColor: '#10b981'
                }).then(() => window.location.href = '/departamentos');

            } catch (error) {
                let mensajeError = 'No se pudo eliminar el departamento';

                if (error.response?.status === 403) {
                    mensajeError = 'No tienes permisos para eliminar departamentos';
                } else if (error.response?.status === 409) {
                    mensajeError = 'No se puede eliminar: el departamento tiene materias asociadas';
                } else if (error.response?.data?.message) {
                    mensajeError = error.response.data.message;
                }

                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensajeError,
                    confirmButtonColor: '#10b981'
                });
            }
        }
    }

    function volverLista() {
        window.location.href = '/departamentos';
    }

    function logout() {
        Swal.fire({
            title: '¿Cerrar sesión?',
            text: '¿Estás seguro que deseas salir?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, salir',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#10b981'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.clear();
                window.location.href = '/login';
            }
        });
    }
</script>

</body>
</html>
