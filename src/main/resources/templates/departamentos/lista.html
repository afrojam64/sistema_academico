<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos - Sistema Académico</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #059669, #10b981);
        }
        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }
        .user-info {
            color: white;
        }
        .main-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .page-header {
            border-bottom: 3px solid #10b981;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .page-header h2 {
            color: #059669;
            margin: 0;
        }
        .btn-nuevo {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 8px;
        }
        .btn-nuevo:hover {
            background: linear-gradient(135deg, #047857, #059669);
            color: white;
        }
        .filter-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }
        .badge-activo {
            background: #dcfce7;
            color: #15803d;
            padding: 6px 15px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 13px;
        }
        .badge-inactivo {
            background: #fee2e2;
            color: #991b1b;
            padding: 6px 15px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 13px;
        }
        .btn-action {
            padding: 5px 10px;
            margin: 2px;
            border-radius: 5px;
            font-size: 14px;
        }
        .table-container {
            overflow-x: auto;
        }
        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #d1d5db;
            border-radius: 5px;
            padding: 5px;
        }
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #d1d5db;
            border-radius: 5px;
            padding: 5px 10px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando departamentos...</p>
    </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="volverDashboard()">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-building"></i> Gestión de Departamentos
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="main-container">
        <!-- Encabezado -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <h2>
                <i class="fas fa-building"></i>
                Lista de Departamentos
            </h2>
            <button class="btn btn-nuevo" onclick="nuevoDepartamento()">
                <i class="fas fa-plus"></i> Nuevo Departamento
            </button>
        </div>

        <!-- Filtros -->
        <div class="filter-section">
            <div class="row align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold">
                        <i class="fas fa-filter"></i> Filtrar por Estado
                    </label>
                    <select class="form-select" id="filtroEstado" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                        <option value="ACTIVO">Activos</option>
                        <option value="INACTIVO">Inactivos</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-secondary w-100" onclick="limpiarFiltros()">
                        <i class="fas fa-eraser"></i> Limpiar Filtros
                    </button>
                </div>
                <div class="col-md-6 text-end">
                    <span class="text-muted">
                        <i class="fas fa-info-circle"></i>
                        Total de departamentos: <strong id="totalDepartamentos">0</strong>
                    </span>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="table-container">
            <table id="tablaDepartamentos" class="table table-striped table-hover">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Datos cargados dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // ========================================
    // VARIABLES GLOBALES
    // ========================================

    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    const userRole = localStorage.getItem('userRole');

    // Verificar autenticación
    if (!token) {
        window.location.href = '/login';
    }

    // Mostrar nombre de usuario
    document.getElementById('userName').textContent = userName || 'Admin';

    // Variable para DataTable
    let tablaDepartamentos;
    let departamentosData = [];

    // ========================================
    // INICIALIZACIÓN
    // ========================================

    $(document).ready(function() {
        cargarDepartamentos();
    });

    // ========================================
    // CARGAR DEPARTAMENTOS DESDE API
    // ========================================

    async function cargarDepartamentos() {
        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
            const response = await axios.get('http://localhost:8080/api/departamentos', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            departamentosData = response.data;

            // Actualizar contador
            document.getElementById('totalDepartamentos').textContent = departamentosData.length;

            // Inicializar DataTable
            inicializarDataTable(departamentosData);

            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            console.error('Error cargando departamentos:', error);
            document.getElementById('loadingOverlay').style.display = 'none';

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: error.response?.data?.message || 'No se pudieron cargar los departamentos',
                confirmButtonColor: '#10b981'
            });
        }
    }

    // ========================================
    // INICIALIZAR DATATABLE
    // ========================================

    function inicializarDataTable(data) {
        // Destruir tabla existente si existe
        if (tablaDepartamentos) {
            tablaDepartamentos.destroy();
        }

        tablaDepartamentos = $('#tablaDepartamentos').DataTable({
            data: data,
            columns: [
                {
                    data: 'id',
                    width: '60px'
                },
                {
                    data: 'codigo',
                    width: '100px',
                    render: function(data) {
                        return `<span class="badge bg-secondary">${data}</span>`;
                    }
                },
                {
                    data: 'nombre',
                    render: function(data) {
                        return `<strong>${data}</strong>`;
                    }
                },
                {
                    data: 'descripcion',
                    render: function(data) {
                        return data || '<span class="text-muted fst-italic">Sin descripción</span>';
                    }
                },
                {
                    data: 'estado',
                    width: '120px',
                    render: function(data) {
                        if (data === 'ACTIVO') {
                            return '<span class="badge-activo"><i class="fas fa-check-circle"></i> ACTIVO</span>';
                        } else {
                            return '<span class="badge-inactivo"><i class="fas fa-times-circle"></i> INACTIVO</span>';
                        }
                    }
                },
                {
                    data: null,
                    orderable: false,
                    width: '200px',
                    render: function(data) {
                        return generarBotonesAccion(data);
                    }
                }
            ],
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            },
            order: [0, 'asc'],
            pageLength: 10,
            responsive: true,
            dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>>rtip'
        });
    }

    // ========================================
    // GENERAR BOTONES DE ACCIÓN
    // ========================================

    function generarBotonesAccion(departamento) {
        let botones = `
            <button class="btn btn-info btn-action" onclick="verDepartamento(${departamento.id})" title="Ver detalles">
                <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-warning btn-action" onclick="editarDepartamento(${departamento.id})" title="Editar">
                <i class="fas fa-edit"></i>
            </button>
        `;

        // Botón de activar/desactivar
        if (departamento.estado === 'ACTIVO') {
            botones += `
                <button class="btn btn-secondary btn-action" onclick="desactivarDepartamento(${departamento.id})" title="Desactivar">
                    <i class="fas fa-ban"></i>
                </button>
            `;
        } else {
            botones += `
                <button class="btn btn-success btn-action" onclick="activarDepartamento(${departamento.id})" title="Activar">
                    <i class="fas fa-check-circle"></i>
                </button>
            `;
        }

        // Botón eliminar solo para SUPER_ADMIN
        if (userRole === 'SUPER_ADMIN') {
            botones += `
                <button class="btn btn-danger btn-action" onclick="eliminarDepartamento(${departamento.id})" title="Eliminar">
                    <i class="fas fa-trash"></i>
                </button>
            `;
        }

        return botones;
    }

    // ========================================
    // FILTROS
    // ========================================

    function aplicarFiltros() {
        const estadoSeleccionado = document.getElementById('filtroEstado').value;

        let datosFiltrados = departamentosData;

        // Filtrar por estado
        if (estadoSeleccionado) {
            datosFiltrados = datosFiltrados.filter(dep => dep.estado === estadoSeleccionado);
        }

        // Reinicializar tabla con datos filtrados
        inicializarDataTable(datosFiltrados);
    }

    function limpiarFiltros() {
        document.getElementById('filtroEstado').value = '';
        inicializarDataTable(departamentosData);
    }

    // ========================================
    // ACCIONES: NAVEGACIÓN
    // ========================================

    function nuevoDepartamento() {
        window.location.href = '/departamentos/nuevo';
    }

    function verDepartamento(id) {
        window.location.href = `/departamentos/ver/${id}`;
    }

    function editarDepartamento(id) {
        window.location.href = `/departamentos/editar/${id}`;
    }

    // ========================================
    // ACCIONES: DESACTIVAR
    // ========================================

    async function desactivarDepartamento(id) {
        const result = await Swal.fire({
            title: '¿Desactivar departamento?',
            text: '¿Estás seguro de desactivar este departamento?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, desactivar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#f59e0b'
        });

        if (result.isConfirmed) {
            try {
                await axios.patch(
                    `http://localhost:8080/api/departamentos/${id}/desactivar?rolUsuario=${userRole}`,
                    {},
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: '¡Desactivado!',
                    text: 'El departamento fue desactivado correctamente',
                    confirmButtonColor: '#10b981'
                }).then(() => {
                    cargarDepartamentos();
                });

            } catch (error) {
                console.error('Error al desactivar:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.response?.data?.message || 'No se pudo desactivar el departamento',
                    confirmButtonColor: '#10b981'
                });
            }
        }
    }

    // ========================================
    // ACCIONES: ACTIVAR
    // ========================================

    async function activarDepartamento(id) {
        const result = await Swal.fire({
            title: '¿Activar departamento?',
            text: '¿Estás seguro de activar este departamento?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, activar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#10b981'
        });

        if (result.isConfirmed) {
            try {
                await axios.patch(
                    `http://localhost:8080/api/departamentos/${id}/activar?rolUsuario=${userRole}`,
                    {},
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: '¡Activado!',
                    text: 'El departamento fue activado correctamente',
                    confirmButtonColor: '#10b981'
                }).then(() => {
                    cargarDepartamentos();
                });

            } catch (error) {
                console.error('Error al activar:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.response?.data?.message || 'No se pudo activar el departamento',
                    confirmButtonColor: '#10b981'
                });
            }
        }
    }

    // ========================================
    // ACCIONES: ELIMINAR (SOLO SUPER_ADMIN)
    // ========================================

    async function eliminarDepartamento(id) {
        const result = await Swal.fire({
            title: '¿Eliminar departamento?',
            html: `
                <p>Esta acción es <strong>IRREVERSIBLE</strong>.</p>
                <p>Escribe <strong>CONFIRMAR</strong> para continuar:</p>
            `,
            icon: 'warning',
            input: 'text',
            inputPlaceholder: 'Escribe CONFIRMAR',
            showCancelButton: true,
            confirmButtonText: 'Eliminar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#dc2626',
            inputValidator: (value) => {
                if (value !== 'CONFIRMAR') {
                    return 'Debes escribir CONFIRMAR para continuar';
                }
            }
        });

        if (result.isConfirmed) {
            try {
                await axios.delete(
                    `http://localhost:8080/api/departamentos/${id}?rolUsuario=${userRole}`,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: 'Departamento eliminado',
                    text: 'El departamento fue eliminado permanentemente',
                    confirmButtonColor: '#10b981'
                }).then(() => {
                    cargarDepartamentos();
                });

            } catch (error) {
                console.error('Error al eliminar:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.response?.data?.message || 'No se pudo eliminar el departamento',
                    confirmButtonColor: '#10b981'
                });
            }
        }
    }

    // ========================================
    // NAVEGACIÓN
    // ========================================

    function volverDashboard() {
        // Redirigir según rol
        const dashboards = {
            'SUPER_ADMIN': '/dashboard/super-admin',
            'ADMIN': '/dashboard/admin',
            'PROFESOR': '/dashboard/profesor',
            'ESTUDIANTE': '/dashboard/estudiante'
        };
        window.location.href = dashboards[userRole] || '/dashboard/admin';
    }

    function logout() {
        Swal.fire({
            title: '¿Cerrar sesión?',
            text: '¿Estás seguro que deseas salir?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, salir',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#10b981'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.clear();
                window.location.href = '/login';
            }
        });
    }
</script>

</body>
</html>
