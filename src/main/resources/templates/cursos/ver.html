<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Curso - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        .user-info { color: white; }
        .detail-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .detail-header {
            border-bottom: 3px solid #8b5cf6;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .detail-row {
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .detail-label {
            font-weight: 600;
            color: #374151;
        }
        .detail-value {
            color: #1f2937;
        }
        .badge-codigo {
            background: #8b5cf6;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .badge-cupos {
            background: #10b981;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .badge-sin-cupos {
            background: #ef4444;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .badge-estado-activo {
            background: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .badge-estado-inactivo {
            background: #ef4444;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        .btn-purple {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            border: none;
            color: white;
        }
        .btn-purple:hover {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border" style="width: 3rem; height: 3rem; color: #8b5cf6;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando información del curso...</p>
    </div>
</div>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="window.location.href='/cursos'">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-eye"></i> Detalles del Curso
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="detail-container">
        <div class="detail-header">
            <h2><i class="fas fa-chalkboard"></i> Información del Curso</h2>
            <p class="text-muted mb-0">Detalles completos del curso</p>
        </div>

        <div id="cursoDetails">
            <!-- Los detalles se cargarán aquí -->
        </div>

        <div class="d-flex gap-2 justify-content-end mt-4">
            <button class="btn btn-secondary" onclick="window.location.href='/cursos'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <button class="btn btn-purple" onclick="editar()">
                <i class="fas fa-edit"></i> Editar
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');

    if (!token) window.location.href = '/login';

    document.getElementById('userName').textContent = userName || 'Admin';

    const urlParams = new URLSearchParams(window.location.search);
    const cursoId = urlParams.get('id') || window.location.pathname.split('/').pop();

    async function cargarCurso() {
        try {
            const response = await axios.get(`http://localhost:8080/api/cursos/${cursoId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const curso = response.data;

            const estadoBadge = curso.estado === 'ACTIVO'
                ? '<span class="badge-estado-activo">ACTIVO</span>'
                : '<span class="badge-estado-inactivo">INACTIVO</span>';

            const cuposBadge = curso.cuposDisponibles > 0
                ? `<span class="badge-cupos">${curso.cupoActual}/${curso.cupoMaximo} (${curso.cuposDisponibles} disponibles)</span>`
                : `<span class="badge-sin-cupos">COMPLETO (${curso.cupoMaximo}/${curso.cupoMaximo})</span>`;

            const html = `
                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">ID</div>
                        <div class="col-md-8 detail-value">${curso.id}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Código</div>
                        <div class="col-md-8 detail-value">
                            <span class="badge-codigo">${curso.codigo}</span>
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Nombre del Curso</div>
                        <div class="col-md-8 detail-value">
                            <strong>${curso.nombre}</strong>
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Materia</div>
                        <div class="col-md-8 detail-value">${curso.materia}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Profesor</div>
                        <div class="col-md-8 detail-value">
                            <i class="fas fa-chalkboard-teacher"></i> ${curso.profesor}
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Periodo</div>
                        <div class="col-md-8 detail-value">
                            <i class="fas fa-calendar"></i> ${curso.periodo}
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Cupos</div>
                        <div class="col-md-8 detail-value">${cuposBadge}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Fecha de Inicio</div>
                        <div class="col-md-8 detail-value">
                            <i class="fas fa-calendar-day"></i> ${curso.fechaInicio}
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Fecha de Fin</div>
                        <div class="col-md-8 detail-value">
                            <i class="fas fa-calendar-day"></i> ${curso.fechaFin}
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Estado</div>
                        <div class="col-md-8 detail-value">${estadoBadge}</div>
                    </div>
                </div>
            `;

            document.getElementById('cursoDetails').innerHTML = html;
            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            console.error('Error cargando curso:', error);
            document.getElementById('loadingOverlay').style.display = 'none';

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudo cargar la información del curso',
                confirmButtonColor: '#8b5cf6'
            }).then(() => {
                window.location.href = '/cursos';
            });
        }
    }

    cargarCurso();

    function editar() {
        window.location.href = `/cursos/editar/${cursoId}`;
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
