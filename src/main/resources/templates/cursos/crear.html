<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Curso - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        .user-info { color: white; }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .form-header {
            border-bottom: 3px solid #8b5cf6;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .btn-purple {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            border: none;
            color: white;
        }
        .btn-purple:hover {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;
        }
        .char-counter {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="window.location.href='/cursos'">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-chalkboard"></i> Nuevo Curso
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h2><i class="fas fa-chalkboard"></i> Información del Curso</h2>
            <p class="text-muted mb-0">Completa los campos para crear un nuevo curso</p>
        </div>

        <form id="formCrearCurso">
            <!-- CÓDIGO -->
            <div class="mb-4">
                <label for="codigo" class="form-label fw-bold">
                    Código <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="codigo"
                       placeholder="Ej: CURSO-2025-001" maxlength="20" required>
                <div class="char-counter">
                    <span id="codigoCounter">0/20</span> caracteres
                </div>
            </div>

            <!-- NOMBRE -->
            <div class="mb-4">
                <label for="nombre" class="form-label fw-bold">
                    Nombre del Curso <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="nombre"
                       placeholder="Ej: Cálculo Diferencial - Grupo A" maxlength="100" required>
                <div class="char-counter">
                    <span id="nombreCounter">0/100</span> caracteres
                </div>
            </div>

            <!-- MATERIA -->
            <div class="mb-4">
                <label for="materiaId" class="form-label fw-bold">
                    Materia <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="materiaId" required>
                    <option value="">Selecciona una materia</option>
                </select>
            </div>

            <!-- PROFESOR -->
            <div class="mb-4">
                <label for="profesorId" class="form-label fw-bold">
                    Profesor <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="profesorId" required>
                    <option value="">Selecciona un profesor</option>
                </select>
            </div>

            <!-- CUPO MÁXIMO -->
            <div class="mb-4">
                <label for="cupoMaximo" class="form-label fw-bold">
                    Cupo Máximo <span class="text-danger">*</span>
                </label>
                <input type="number" class="form-control" id="cupoMaximo"
                       placeholder="Ej: 30" min="1" max="100" required>
                <small class="text-muted">Entre 1 y 100 estudiantes</small>
            </div>

            <!-- PERIODO -->
            <div class="mb-4">
                <label for="periodo" class="form-label fw-bold">
                    Periodo <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="periodo"
                       placeholder="Ej: 2025-1" maxlength="20" required>
                <div class="char-counter">
                    <span id="periodoCounter">0/20</span> caracteres
                </div>
            </div>

            <!-- FECHA INICIO -->
            <div class="mb-4">
                <label for="fechaInicio" class="form-label fw-bold">
                    Fecha de Inicio <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" id="fechaInicio" required>
            </div>

            <!-- FECHA FIN -->
            <div class="mb-4">
                <label for="fechaFin" class="form-label fw-bold">
                    Fecha de Fin <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" id="fechaFin" required>
            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2 justify-content-end mt-4">
                <button type="button" class="btn btn-secondary" onclick="cancelar()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-purple">
                    <i class="fas fa-save"></i> Crear Curso
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');

    if (!token) window.location.href = '/login';
    document.getElementById('userName').textContent = userName || 'Admin';

    let formModificado = false;

    async function cargarDatos() {
        try {
            // Cargar materias activas
            const materiasResponse = await axios.get('http://localhost:8080/api/materias/activas', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const selectMaterias = document.getElementById('materiaId');
            materiasResponse.data.forEach(materia => {
                const option = document.createElement('option');
                option.value = materia.id;
                option.textContent = `${materia.codigo} - ${materia.nombre}`;
                selectMaterias.appendChild(option);
            });

            // Cargar profesores activos
            const profesoresResponse = await axios.get('http://localhost:8080/api/profesores/activos', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const selectProfesores = document.getElementById('profesorId');
            profesoresResponse.data.forEach(profesor => {
                const option = document.createElement('option');
                option.value = profesor.id;
                option.textContent = profesor.nombreCompleto;
                selectProfesores.appendChild(option);
            });

        } catch (error) {
            console.error('Error cargando datos:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudieron cargar las materias y profesores',
                confirmButtonColor: '#8b5cf6'
            });
        }
    }

    cargarDatos();

    // Contadores
    document.getElementById('codigo').addEventListener('input', function(e) {
        document.getElementById('codigoCounter').textContent = `${e.target.value.length}/20`;
        formModificado = true;
    });

    document.getElementById('nombre').addEventListener('input', function(e) {
        document.getElementById('nombreCounter').textContent = `${e.target.value.length}/100`;
        formModificado = true;
    });

    document.getElementById('periodo').addEventListener('input', function(e) {
        document.getElementById('periodoCounter').textContent = `${e.target.value.length}/20`;
        formModificado = true;
    });

    ['materiaId', 'profesorId', 'cupoMaximo', 'fechaInicio', 'fechaFin'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => formModificado = true);
    });

    // Enviar formulario
    document.getElementById('formCrearCurso').addEventListener('submit', async function(e) {
        e.preventDefault();

        const codigo = document.getElementById('codigo').value.trim();
        const nombre = document.getElementById('nombre').value.trim();
        const materiaId = document.getElementById('materiaId').value;
        const profesorId = document.getElementById('profesorId').value;
        const cupoMaximo = parseInt(document.getElementById('cupoMaximo').value);
        const periodo = document.getElementById('periodo').value.trim();
        const fechaInicio = document.getElementById('fechaInicio').value;
        const fechaFin = document.getElementById('fechaFin').value;

        if (!codigo || !nombre || !materiaId || !profesorId || !cupoMaximo || !periodo || !fechaInicio || !fechaFin) {
            Swal.fire({
                icon: 'warning',
                title: 'Campos incompletos',
                text: 'Completa todos los campos obligatorios',
                confirmButtonColor: '#8b5cf6'
            });
            return;
        }

        if (cupoMaximo < 1 || cupoMaximo > 100) {
            Swal.fire({
                icon: 'warning',
                title: 'Cupo inválido',
                text: 'El cupo debe estar entre 1 y 100',
                confirmButtonColor: '#8b5cf6'
            });
            return;
        }

        if (new Date(fechaFin) <= new Date(fechaInicio)) {
            Swal.fire({
                icon: 'warning',
                title: 'Fechas inválidas',
                text: 'La fecha de fin debe ser posterior a la fecha de inicio',
                confirmButtonColor: '#8b5cf6'
            });
            return;
        }

        const materiaNombre = document.getElementById('materiaId').selectedOptions[0].text;
        const profesorNombre = document.getElementById('profesorId').selectedOptions[0].text;

        const result = await Swal.fire({
            title: '¿Crear curso?',
            html: `
                <div style="text-align: left; margin: 20px;">
                    <p><strong>Código:</strong> ${codigo}</p>
                    <p><strong>Nombre:</strong> ${nombre}</p>
                    <p><strong>Materia:</strong> ${materiaNombre}</p>
                    <p><strong>Profesor:</strong> ${profesorNombre}</p>
                    <p><strong>Cupo:</strong> ${cupoMaximo} estudiantes</p>
                    <p><strong>Periodo:</strong> ${periodo}</p>
                    <p><strong>Inicio:</strong> ${fechaInicio}</p>
                    <p><strong>Fin:</strong> ${fechaFin}</p>
                </div>
            `,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, crear',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#8b5cf6'
        });

        if (result.isConfirmed) {
            try {
                const datos = {
                    codigo: codigo,
                    nombre: nombre,
                    materiaId: parseInt(materiaId),
                    profesorId: parseInt(profesorId),
                    cupoMaximo: cupoMaximo,
                    periodo: periodo,
                    fechaInicio: fechaInicio,
                    fechaFin: fechaFin
                };

                await axios.post(
                    'http://localhost:8080/api/cursos',
                    datos,
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: '¡Curso creado!',
                    text: 'El curso fue creado correctamente',
                    confirmButtonColor: '#8b5cf6'
                }).then(() => {
                    window.location.href = '/cursos';
                });

            } catch (error) {
                let mensajeError = 'No se pudo crear el curso';

                if (error.response?.data?.message?.includes('código')) {
                    mensajeError = 'Ya existe un curso con ese código';
                } else if (error.response?.data?.message) {
                    mensajeError = error.response.data.message;
                }

                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: mensajeError,
                    confirmButtonColor: '#8b5cf6'
                });
            }
        }
    });

    function cancelar() {
        if (formModificado) {
            Swal.fire({
                title: '¿Descartar cambios?',
                text: 'Se perderán los datos ingresados',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, descartar',
                cancelButtonText: 'Continuar',
                confirmButtonColor: '#dc2626'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/cursos';
                }
            });
        } else {
            window.location.href = '/cursos';
        }
    }

    window.addEventListener('beforeunload', function(e) {
        if (formModificado) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
</html>
