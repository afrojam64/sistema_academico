<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Inscripción - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
        }
        .navbar-brand { color: white !important; font-weight: 700; }
        .user-info { color: white; }
        .detail-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .detail-header {
            border-bottom: 3px solid #f59e0b;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .detail-row {
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .detail-label {
            font-weight: 600;
            color: #374151;
        }
        .detail-value {
            color: #1f2937;
        }
        .badge-activo {
            background: #10b981;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }
        .badge-retirado {
            background: #ef4444;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }
        .badge-completado {
            background: #3b82f6;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            border: none;
            color: white;
        }
        .btn-warning:hover {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: white;
        }
        .action-buttons {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border" style="width: 3rem; height: 3rem; color: #f59e0b;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-3 mb-0">Cargando información de la inscripción...</p>
    </div>
</div>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <div>
            <button class="btn btn-outline-light me-2" onclick="window.location.href='/inscripciones'">
                <i class="fas fa-arrow-left"></i> Volver a Lista
            </button>
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-eye"></i> Detalles de la Inscripción
            </span>
        </div>
        <div class="user-info">
            <i class="fas fa-user"></i>
            <span id="userName">Admin</span>
            <button class="btn btn-sm btn-light ms-3" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="detail-container">
        <div class="detail-header">
            <h2><i class="fas fa-clipboard-check"></i> Información de la Inscripción</h2>
            <p class="text-muted mb-0">Detalles completos de la inscripción</p>
        </div>

        <div id="inscripcionDetails">
            <!-- Los detalles se cargarán aquí -->
        </div>

        <div class="action-buttons">
            <div class="d-flex gap-2 justify-content-end">
                <button class="btn btn-secondary" onclick="window.location.href='/inscripciones'">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <div id="actionButtons">
                    <!-- Botones de acción se cargarán aquí -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    const userRole = localStorage.getItem('userRole');

    if (!token) window.location.href = '/login';

    document.getElementById('userName').textContent = userName || 'Admin';

    const urlParams = new URLSearchParams(window.location.search);
    const inscripcionId = urlParams.get('id') || window.location.pathname.split('/').pop();

    let inscripcionActual = null;

    async function cargarInscripcion() {
        try {
            const response = await axios.get(`http://localhost:8080/api/inscripciones/${inscripcionId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            inscripcionActual = response.data;

            let estadoBadge = '';
            switch(inscripcionActual.estado) {
                case 'ACTIVO':
                    estadoBadge = '<span class="badge-activo">ACTIVO</span>';
                    break;
                case 'RETIRADO':
                    estadoBadge = '<span class="badge-retirado">RETIRADO</span>';
                    break;
                case 'COMPLETADO':
                    estadoBadge = '<span class="badge-completado">COMPLETADO</span>';
                    break;
            }

            const html = `
                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">ID</div>
                        <div class="col-md-8 detail-value">${inscripcionActual.id}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Estudiante</div>
                        <div class="col-md-8 detail-value">
                            <i class="fas fa-user-graduate"></i> <strong>${inscripcionActual.estudiante}</strong>
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Curso</div>
                        <div class="col-md-8 detail-value">
                            <i class="fas fa-chalkboard"></i> ${inscripcionActual.curso}
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Fecha de Inscripción</div>
                        <div class="col-md-8 detail-value">
                            <i class="fas fa-calendar-day"></i> ${inscripcionActual.fechaInscripcion}
                        </div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="row">
                        <div class="col-md-4 detail-label">Estado</div>
                        <div class="col-md-8 detail-value">${estadoBadge}</div>
                    </div>
                </div>
            `;

            document.getElementById('inscripcionDetails').innerHTML = html;

            // Mostrar botones de acción según el estado
            cargarBotonesAccion();

            document.getElementById('loadingOverlay').style.display = 'none';

        } catch (error) {
            console.error('Error cargando inscripción:', error);
            document.getElementById('loadingOverlay').style.display = 'none';

            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'No se pudo cargar la información de la inscripción',
                confirmButtonColor: '#f59e0b'
            }).then(() => {
                window.location.href = '/inscripciones';
            });
        }
    }

    function cargarBotonesAccion() {
        const actionButtonsDiv = document.getElementById('actionButtons');
        let buttons = '';

        if (inscripcionActual.estado === 'ACTIVO') {
            buttons = `
                <button class="btn btn-danger" onclick="retirarInscripcion()">
                    <i class="fas fa-ban"></i> Retirar
                </button>
                <button class="btn btn-success" onclick="completarInscripcion()">
                    <i class="fas fa-check"></i> Completar
                </button>
            `;
        }

        actionButtonsDiv.innerHTML = buttons;
    }

    async function retirarInscripcion() {
        const result = await Swal.fire({
            title: '¿Retirar inscripción?',
            text: 'El estudiante será retirado del curso y se liberará el cupo',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Sí, retirar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#dc2626'
        });

        if (result.isConfirmed) {
            try {
                await axios.patch(
                    `http://localhost:8080/api/inscripciones/${inscripcionId}/retirar`,
                    {},
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: '¡Retirada!',
                    text: 'La inscripción fue retirada correctamente',
                    confirmButtonColor: '#f59e0b'
                }).then(() => {
                    window.location.reload();
                });

            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.response?.data?.message || 'No se pudo retirar la inscripción',
                    confirmButtonColor: '#f59e0b'
                });
            }
        }
    }

    async function completarInscripcion() {
        const result = await Swal.fire({
            title: '¿Completar inscripción?',
            text: 'Se marcará el curso como completado por el estudiante',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, completar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#f59e0b'
        });

        if (result.isConfirmed) {
            try {
                await axios.patch(
                    `http://localhost:8080/api/inscripciones/${inscripcionId}/completar?rolUsuario=${userRole}`,
                    {},
                    { headers: { 'Authorization': `Bearer ${token}` } }
                );

                Swal.fire({
                    icon: 'success',
                    title: '¡Completada!',
                    text: 'La inscripción fue completada correctamente',
                    confirmButtonColor: '#f59e0b'
                }).then(() => {
                    window.location.reload();
                });

            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.response?.data?.message || 'No se pudo completar la inscripción',
                    confirmButtonColor: '#f59e0b'
                });
            }
        }
    }

    cargarInscripcion();

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>

</body>
</html>
